[project]
name = "fasta2go"
version = "0.1.0"
description = "Extraction stage: FASTA -> DuckDB with sequence features, UniProt metadata and GO annotations."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "biopython>=1.85",
    "duckdb>=1.3.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "seaborn>=0.13.2",
]

[tool.uv]
# This project is run from the repository root, not installed as a package.
package = false
